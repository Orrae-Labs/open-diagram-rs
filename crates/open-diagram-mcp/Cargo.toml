[package]
name = "open-diagram-mcp"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP server that draws architecture diagrams from JSON or Mermaid."
readme = "README.md"
keywords = ["diagram", "mcp", "svg", "architecture", "mermaid"]
categories = ["command-line-utilities", "visualization"]

[lints]
workspace = true

[lib]
name = "open_diagram_mcp"
path = "src/lib.rs"

[[bin]]
name = "open-diagram-mcp"
path = "src/main.rs"

[dependencies]
base64.workspace = true
clap = { workspace = true, features = ["derive"] }
open-diagram = { path = "../open-diagram", version = "0.1.0" }
rmcp = { workspace = true, features = ["transport-io", "skills-fs"] }
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
base64.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread"] }
