[workspace]
resolver = "3"
members = [
    "crates/open-diagram",
    "crates/open-diagram-cli",
    "crates/open-diagram-mcp",
    "crates/quickstart-consumer",
]

[workspace.package]
authors = ["TJ Challstrom", "Luke Deasy", "Scott Williams"]
edition = "2024"
license = "MIT AND OFL-1.1 AND Apache-2.0 AND CC-BY-ND-2.0"
rust-version = "1.100"
repository = "https://github.com/Orrae-Labs/open-diagram-rs"
description = "Building blocks for dense architecture diagrams that check their own layout."

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
wildcard_enum_match_arm = "warn"
mem_forget = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
exit = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
let_underscore_must_use = "warn"
allow_attributes = "warn"

[workspace.dependencies]
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
base64 = "0.23"
clap = "4"
regex = "1"
image = "0.25"
which = "8"
rmcp = { version = "3.11", features = ["transport-io", "skills-fs"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
