name: diagrams

on:
  push:
    branches: [main]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: diagrams-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  diagrams:
    if: github.event_name == 'push' || (github.event.review.state == 'approved' && github.event.pull_request.base.ref == 'main' && github.event.review.user.login == 'borrow-checker')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          files: |
            examples/*.json
            examples/*.mmd
            crates/open-diagram/templates/*.json
          mode: check
