name: crate-provenance

on:
  workflow_call:
    inputs:
      package:
        description: open-diagram or open-diagram-cli
        required: true
        type: string

# Default for every job. The attest job adds the signing permissions. The package job does not.
permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-24
        with:
          toolchain: 1.100.0
      - name: Require a release tag that matches both package versions
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -eu
          case "$PACKAGE" in
            open-diagram|open-diagram-cli) ;;
            *) echo "unexpected package $PACKAGE"; exit 1 ;;
          esac
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "ref type $GITHUB_REF_TYPE is not a tag"
            exit 1
          fi
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ref $GITHUB_REF_NAME is not a vX.Y.Z tag"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          for manifest in crates/open-diagram/Cargo.toml crates/open-diagram-cli/Cargo.toml; do
            version=$(awk -F '"' '/^version = / { print $2; exit }' "$manifest")
            test "$version" = "$tag"
          done
      - name: Package the crate
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -eu
          ok=0
          for _ in 1 2 3 4 5 6; do
            if cargo package -p "$PACKAGE" --locked; then
              ok=1
              break
            fi
            sleep 15
          done
          test "$ok" = 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-${{ inputs.package }}
          path: target/package/${{ inputs.package }}-*.crate
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate-${{ inputs.package }}
          path: attested
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: attested/${{ inputs.package }}-*.crate
